name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: make lint

      - name: Compile Python sources
        run: make check

      - name: Run tests
        run: make test

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build add-on
        run: ./build.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/anki_ai_workspace.ankiaddon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to AnkiWeb
        if: vars.PUBLISH_TO_ANKIWEB == 'true'
        uses: lmallez/anki-addon-publish-action@v0.1.1
        with:
          file: dist/anki_ai_workspace.ankiaddon
          anki-user: ${{ secrets.ANKI_USER }}
          anki-password: ${{ secrets.ANKI_PASSWORD }}
          id: ${{ vars.ANKI_ADDON_ID }}
          name: "[BETA] Anki AI Workspace"
          support-page: https://github.com/${{ github.repository }}
          tags: productivity
          description-file: src/anki_ai_workspace/README.md
